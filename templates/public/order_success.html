{% extends 'base.html' %}
{% block title %}Pedido recebido | Aroma Gourmet{% endblock %}
{% block content %}
<main class="success-page"><section><p class="eyebrow">PEDIDO RECEBIDO</p><h1>Obrigada pela escolha.</h1><p>Seu pedido foi registrado. Guarde este código para acompanhar o preparo:</p><p class="tracking-code" id="tracking-code">{{ tracking_code }}</p><button class="outline-button copy-code" type="button" data-copy-target="tracking-code">Copiar código</button><a class="button" href="{{ url_for('public.order_tracking', tracking_code=tracking_code) }}">Acompanhar pedido</a><a class="text-link" href="{{ url_for('public.home') }}">Voltar à cafeteria</a></section></main>
{% endblock %}
