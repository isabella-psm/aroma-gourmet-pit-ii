{% extends 'base.html' %}
{% block title %}{{ 'Editar' if product else 'Novo' }} produto | Aroma Gourmet{% endblock %}
{% block content %}
<header class="admin-header"><div class="container"><a class="brand dark" href="{{ url_for('public.home') }}">AROMA <span>GOURMET</span></a><a href="{{ url_for('admin.dashboard') }}">← Voltar ao painel</a></div></header><main class="admin-main narrow container"><p class="eyebrow">CADASTRO</p><h1>{{ 'Editar produto' if product else 'Novo produto' }}</h1>{% include 'partials/messages.html' %}<form method="post" class="form editor-form"><label>Nome<input name="nome" required value="{{ product.nome if product else '' }}"></label><label>Categoria<select name="categoria_id" required>{% for category in categories %}<option value="{{ category.id }}" {% if product and product.categoria_id == category.id %}selected{% endif %}>{{ category.nome }}</option>{% endfor %}</select></label><label>Descrição<textarea name="descricao" required rows="4">{{ product.descricao if product else '' }}</textarea></label><label>Preço (R$)<input name="preco" type="number" required min="0" step="0.01" value="{{ product.preco if product else '' }}"></label><label>URL da imagem<input name="imagem_url" type="url" required value="{{ product.imagem_url if product else '' }}" placeholder="https://..."></label><label class="check"><input name="disponivel" type="checkbox" {% if not product or product.disponivel %}checked{% endif %}> Disponível no cardápio</label><button class="button" type="submit">{{ 'Salvar alterações' if product else 'Cadastrar produto' }}</button></form></main>
{% endblock %}
